<template>
    <lightning-card icon-name="custom:custom108" title="חתימת חייל על אמצעי לילה">
        
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            
            <lightning-record-view-form record-id={recordId} object-api-name="Night_Device__c">
                <div class="equipment-header slds-box slds-theme_shade slds-m-bottom_medium">
                    <div class="slds-media slds-media_center">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="standard:product" size="medium"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <div class="slds-grid slds-grid_align-spread">
                                <div>
                                    <p class="slds-text-heading_small slds-text-title_caps slds-text-color_weak">אמצעי נוכחי</p>
                                    
                                    <h1 class="slds-text-heading_medium slds-var-m-bottom_xx-small" style="font-weight: 700;">
                                        {deviceTitle}
                                    </h1>

                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="slds-grid slds-wrap slds-gutters slds-m-top_medium slds-border_top slds-p-top_small">
                        
                        <div class="slds-col slds-size_1-of-3">
                            <div class="field-wrapper">
                                <lightning-icon icon-name="utility:work_order_type" size="x-small"></lightning-icon>
                                <span class="label-text">סוג:</span>
                                <lightning-output-field field-name="Type__c" variant="label-hidden"></lightning-output-field>
                            </div>
                        </div>

                        <div class="slds-col slds-size_1-of-3">
                            <div class="field-wrapper">
                                <lightning-icon icon-name="utility:info" size="x-small"></lightning-icon>
                                <span class="label-text">סטטוס:</span>
                                <lightning-output-field field-name="Status__c" variant="label-hidden"></lightning-output-field>
                            </div>
                        </div>

                        <div class="slds-col slds-size_1-of-3">
                            <div class="field-wrapper">
                                <lightning-icon icon-name="utility:checkin" size="x-small"></lightning-icon>
                                <span class="label-text">מיקום:</span>
                                <lightning-output-field field-name="Current_Location__c" variant="label-hidden"></lightning-output-field>
                            </div>
                        </div>
                    </div>
                </div>
            </lightning-record-view-form>

            <div class="slds-box slds-theme_default">
                <h3 class="slds-text-heading_small slds-m-bottom_medium slds-border_bottom slds-p-bottom_x-small">
                    <lightning-icon icon-name="utility:adduser" size="x-small" class="slds-m-left_small"></lightning-icon>
                    פרטי החתמה
                </h3>

                <lightning-layout multiple-rows horizontal-align="spread">
                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="5" padding="horizontal-small">
                        <lightning-combobox
                            name="soldier"
                            label="בחר חייל לחתימה"
                            value={selectedSoldierId}
                            placeholder="חפש ברשימה..."
                            options={soldierOptions}
                            onchange={handleSoldierChange}
                            required>
                        </lightning-combobox>
                    </lightning-layout-item>

                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="7" padding="horizontal-small">
                        <lightning-input
                            type="text"
                            label="מיקום הציוד (אופציונלי)"
                            value={location}
                            onchange={handleLocationChange}
                            placeholder="לדוגמה: פלוגה ב' - אוהל 3">
                        </lightning-input>
                    </lightning-layout-item>
                    
                    <lightning-layout-item size="12" padding="around-small">
                        <lightning-textarea
                            label="הערות לחתימה"
                            value={comments}
                            onchange={handleCommentsChange}
                            placeholder="האם יש חוסרים? הערות על מצב האמצעי..."
                            class="full-width-textarea">
                        </lightning-textarea>
                    </lightning-layout-item>
                </lightning-layout>

                <div class="slds-m-top_medium slds-text-align_center">
                    <lightning-button
                        variant="brand"
                        label="בצע חתימה"
                        icon-name="utility:signature"
                        onclick={handleSign}
                        disabled={isSignDisabled}
                        class="wide-button">
                    </lightning-button>
                </div>
            </div>
        </div>

        <template if:true={isLoading}>
            <div class="slds-backdrop slds-backdrop_open" style="z-index: 9000;"></div>
            <lightning-spinner alternative-text="שומר..." size="medium" variant="brand"></lightning-spinner>
        </template>
    </lightning-card>
</template>

<template>
    
    <template if:true={hasEquipment}>
        <lightning-card>
            
            <div slot="title" class="slds-media slds-media_center">
                <div class="slds-media__figure">
                    <img src={equipmentIconUrl} style="width: 32px; height: 32px;" alt="Equipment Icon"/>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title">
                        <span class="slds-text-heading_small slds-truncate">חתימות ציוד קשר</span>
                    </h2>
                </div>
            </div>

            <div class="slds-p-around_medium">
                <lightning-datatable
                    key-field="Id"
                    data={equipmentData}
                    columns={columns}
                    hide-checkbox-column>
                </lightning-datatable>
            </div>
        </lightning-card>
    </template>

    <div class="slds-m-bottom_medium"></div>

    <template if:true={hasNightDevices}>
        <lightning-card>
            
            <div slot="title" class="slds-media slds-media_center">
                <div class="slds-media__figure">
                    <img src={nightDeviceIconUrl} style="width: 32px; height: 32px;" alt="Night Vision Icon"/>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title">
                        <span class="slds-text-heading_small slds-truncate">חתימות אמרלים</span>
                    </h2>
                </div>
            </div>

            <div class="slds-p-around_medium">
                <lightning-datatable
                    key-field="Id"
                    data={nightDeviceData}
                    columns={columns}
                    hide-checkbox-column>
                </lightning-datatable>
            </div>
        </lightning-card>
    </template>

    <template if:false={hasEquipment}>
        <template if:false={hasNightDevices}>
            <div class="slds-box slds-theme_shade slds-align_absolute-center">
                <p>לא נמצאו חתימות לחייל זה.</p>
            </div>
        </template>
    </template>

</template>

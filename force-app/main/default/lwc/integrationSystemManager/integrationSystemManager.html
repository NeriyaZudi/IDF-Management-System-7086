<template>
    <div class="slds-p-around_medium">
        
        <lightning-datatable
            key-field="id"
            data={systems}
            columns={columns}
            onrowaction={handleRowAction}
            hide-checkbox-column>
        </lightning-datatable>

        <div class="slds-m-top_medium">
            <lightning-button 
                label="Add New System" 
                onclick={openAddModal} 
                variant="brand" 
                icon-name="utility:add">
            </lightning-button>
        </div>

        <template if:true={isAddModalOpen}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeAddModal}>
                            <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                        </button>
                        <h2 class="slds-text-heading_medium">Add Integration System</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-input label="System Name" data-id="sysName" required></lightning-input>
                        <lightning-input label="Endpoint URL" data-id="sysEndpoint" required></lightning-input>
                        <lightning-input label="Max Retries" type="number" data-id="sysRetries" required></lightning-input>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={closeAddModal} class="slds-m-right_small"></lightning-button>
                        <lightning-button label="Save" variant="brand" onclick={handleSaveNew}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <template if:true={isDeactivateModalOpen}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header slds-theme_error slds-theme_alert-texture">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeDeactivateModal}>
                            <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                        </button>
                        <h2 class="slds-text-heading_medium slds-text-color_inverse">Confirm Deactivation</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium slds-text-align_center">
                        <p class="slds-text-heading_small">Are you sure you want to deactivate <b>{selectedSystem.label}</b>?</p>
                        <p class="slds-m-top_small">The system will remain in the configuration but will be marked as <b>Inactive</b>.</p>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={closeDeactivateModal} class="slds-m-right_small"></lightning-button>
                        <lightning-button label="Confirm Deactivation" variant="destructive" onclick={handleDeactivateConfirm}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <template if:true={isReactivateModalOpen}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header slds-theme_success slds-theme_alert-texture">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeReactivateModal}>
                            <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                        </button>
                        <h2 class="slds-text-heading_medium slds-text-color_inverse">Confirm Reactivation</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium slds-text-align_center">
                        <p class="slds-text-heading_small">Are you sure you want to reactivate <b>{selectedSystem.label}</b>?</p>
                        <p class="slds-m-top_small">The Integration Framework resume processing requests for this system.</p>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={closeReactivateModal} class="slds-m-right_small"></lightning-button>
                        <lightning-button label="Confirm Reactivate" variant="success" onclick={handleReactivateConfirm}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

    </div>
</template>
